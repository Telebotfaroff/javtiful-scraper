name: Checkpoint Store Tests

on:
  push:
    branches: [javdl]
  pull_request:
    branches: [javdl]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests Pyrogram

      - name: Run full test suite
        run: python -m pytest -q
