name: Crawl Actress

on:
  workflow_dispatch:
    inputs:
      actress:
        description: "Actress slug (blank = next pending/failed)"
        required: false
        default: ""
        type: string
      delay:
        description: "Seconds between video detail requests"
        required: false
        default: "1"
        type: string
      timeout:
        description: "HTTP timeout in seconds"
        required: false
        default: "30"
        type: string
      retries:
        description: "Retries for video detail requests"
        required: false
        default: "2"
        type: string
      chain:
        description: "Automatically start the next actress after 5 minutes"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: actress-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Migrate actress database layout
        run: python migrate_actress_database.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile actress_index.py actress_crawler.py javtiful_scraper.py crawler.py database.py migrate_actress_database.py providers/*.py

      - name: Crawl actress
        env:
          ACTRESS: ${{ inputs.actress }}
          DELAY: ${{ inputs.delay }}
          TIMEOUT: ${{ inputs.timeout }}
          RETRIES: ${{ inputs.retries }}
        run: |
          python actress_crawler.py \
            --actress "$ACTRESS" \
            --limit "1" \
            --delay "$DELAY" \
            --timeout "$TIMEOUT" \
            --retries "$RETRIES"

      - name: Commit database and actress progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/
          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi
          git commit -m "Crawl actress and update database"
          git push

      - name: Wait 5 minutes before chaining
        if: ${{ success() && inputs.chain }}
        run: sleep 300

      - name: Start next actress run
        if: ${{ success() && inputs.chain }}
        env:
          GH_TOKEN: ${{ github.token }}
          DELAY: ${{ inputs.delay }}
          TIMEOUT: ${{ inputs.timeout }}
          RETRIES: ${{ inputs.retries }}
        run: |
          # GitHub's workflow-dispatch API can temporarily return 5xx errors.
          # Retry dispatch rather than ending the actress chain after one transient failure.
          for attempt in 1 2 3 4; do
            echo "Dispatching next actress crawl (attempt $attempt/4)..."
            if gh workflow run crawl-actress.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f actress="" \
              -f delay="$DELAY" \
              -f timeout="$TIMEOUT" \
              -f retries="$RETRIES" \
              -f chain="true"; then
              echo "Next actress crawl queued successfully."
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              sleep_seconds=$((attempt * 15))
              echo "Dispatch failed; retrying in ${sleep_seconds}s."
              sleep "$sleep_seconds"
            fi
          done

          echo "::error::Could not queue the next actress crawl after 4 attempts."
          exit 1
