name: Crawl Actress

on:
  workflow_dispatch:
    inputs:
      actress:
        description: "Actress slug (blank = next pending/failed)"
        required: false
        default: ""
        type: string
      delay:
        description: "Seconds between video detail requests"
        required: false
        default: "1"
        type: string
      timeout:
        description: "HTTP timeout in seconds"
        required: false
        default: "30"
        type: string
      retries:
        description: "Retries for video detail requests"
        required: false
        default: "2"
        type: string
      chain:
        description: "Automatically start the next actress after 5 minutes"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: actress-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Migrate actress database layout
        run: python migrate_actress_database.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile actress_index.py actress_crawler.py javtiful_scraper.py crawler.py database.py migrate_actress_database.py providers/*.py

      - name: Crawl actress
        env:
          ACTRESS: ${{ inputs.actress }}
          DELAY: ${{ inputs.delay }}
          TIMEOUT: ${{ inputs.timeout }}
          RETRIES: ${{ inputs.retries }}
        run: |
          python actress_crawler.py \
            --actress "$ACTRESS" \
            --limit "1" \
            --delay "$DELAY" \
            --timeout "$TIMEOUT" \
            --retries "$RETRIES"

      - name: Commit database and actress progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/
          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi
          git commit -m "Crawl actress and update database"
          git push

      - name: Wait 5 minutes before chaining
        if: ${{ success() && inputs.chain }}
        run: sleep 300

      - name: Start next actress run
        if: ${{ success() && inputs.chain }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting next actress crawl..."
          gh workflow run crawl-actress.yml \
            --ref main \
            -f actress="" \
            -f delay="${{ inputs.delay }}" \
            -f timeout="${{ inputs.timeout }}" \
            -f retries="${{ inputs.retries }}" \
            -f chain="true"
