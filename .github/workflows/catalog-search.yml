name: Catalog Search

on:
  workflow_dispatch:
    inputs:
      search_type:
        description: "What do you want to search?"
        type: choice
        required: true
        options:
          - video_code
          - channel
          - actress
      query:
        description: "Video code, channel slug/URL, or actress slug/URL"
        type: string
        required: true
      pages:
        description: "Pages to inspect (1-10). For channel/actress, pages to search."
        type: number
        required: true
        default: 3

permissions:
  contents: read

concurrency:
  group: catalog-search-${{ github.ref }}-${{ inputs.search_type }}-${{ inputs.query }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Search catalog
        env:
          SEARCH_TYPE: ${{ inputs.search_type }}
          SEARCH_QUERY: ${{ inputs.query }}
          SEARCH_PAGES: ${{ inputs.pages }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.parse import urlparse

          from providers.javtiful import JavtifulProvider

          BASE = "https://javtiful.com"
          kind = os.environ["SEARCH_TYPE"].strip().lower()
          query = os.environ["SEARCH_QUERY"].strip()
          try:
              pages = max(1, min(10, int(float(os.environ.get("SEARCH_PAGES", "3")))))
          except ValueError:
              pages = 3

          if not query:
              raise SystemExit("Search query cannot be empty.")

          provider = JavtifulProvider(timeout=25, retries=2)
          results = []
          errors = []

          def slug_or_url(value, marker):
              if value.startswith("http://") or value.startswith("https://"):
                  parsed = urlparse(value)
                  if not parsed.netloc.lower().endswith("javtiful.com"):
                      raise ValueError("Only javtiful.com URLs are accepted.")
                  if marker not in parsed.path:
                      raise ValueError(f"URL must contain {marker}")
                  return value.rstrip("/")
              slug = value.strip().strip("/")
              slug = slug.rsplit("/", 1)[-1]
              if not re.fullmatch(r"[A-Za-z0-9_-]+", slug):
                  raise ValueError("Use a valid slug or full page URL.")
              return f"{BASE}{marker}{slug}"

          if kind == "video_code":
              wanted = provider.normalize_code(query)
              if not wanted:
                  raise SystemExit("Enter a video code such as ABC-123.")
              # Search the recent listing pages and match normalized metadata codes.
              for page in range(1, pages + 1):
                  try:
                      batch = provider.scrape_listing(BASE, page=page, enrich=False)
                      for item in batch.get("items", []):
                          code = provider.normalize_code(item.get("code") or "")
                          if code == wanted:
                              results.append(item)
                  except Exception as exc:
                      errors.append(f"Page {page}: {type(exc).__name__}: {exc}")
              # If the listing did not expose the code, let the user know that a
              # direct post URL may be needed rather than guessing a URL.
          elif kind == "channel":
              url = slug_or_url(query, "/channel/")
              for page in range(1, pages + 1):
                  try:
                      batch = provider.scrape_listing(url, page=page, enrich=False)
                      results.extend(batch.get("items", []))
                  except Exception as exc:
                      errors.append(f"Page {page}: {type(exc).__name__}: {exc}")
                      break
          elif kind == "actress":
              url = slug_or_url(query, "/actress/")
              for page in range(1, pages + 1):
                  try:
                      batch = provider.scrape_listing(url, page=page, enrich=False)
                      results.extend(batch.get("items", []))
                  except Exception as exc:
                      errors.append(f"Page {page}: {type(exc).__name__}: {exc}")
                      break
          else:
              raise SystemExit(f"Unsupported search type: {kind}")

          # Deduplicate by canonical post URL.
          unique = {}
          for item in results:
              url = item.get("post_url")
              if url:
                  unique[url] = item
          results = list(unique.values())

          output = {
              "search_type": kind,
              "query": query,
              "pages_requested": pages,
              "result_count": len(results),
              "results": results,
              "errors": errors,
          }
          os.makedirs("search-results", exist_ok=True)
          with open("search-results/results.json", "w", encoding="utf-8") as fh:
              json.dump(output, fh, ensure_ascii=False, indent=2)
              fh.write("\n")

          print(json.dumps({
              "search_type": kind,
              "query": query,
              "pages_requested": pages,
              "result_count": len(results),
              "errors": errors,
              "results": results[:25],
          }, ensure_ascii=False, indent=2))

          if not results and errors:
              raise SystemExit("Search did not complete successfully; see errors above.")
          PY

      - name: Upload search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-search-results
          path: search-results/results.json
          if-no-files-found: ignore
          retention-days: 7
