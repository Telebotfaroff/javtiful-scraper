name: Full scraper database sync

on:
  workflow_dispatch:
    inputs:
      source:
        description: "What do you want to scrape?"
        required: true
        default: all
        type: choice
        options:
          - all
          - main
          - actresses
          - studios
      start_page:
        description: "First page to scrape"
        required: false
        default: "1"
        type: string
      end_page:
        description: "Last page to scrape (0 = all remaining pages)"
        required: false
        default: "0"
        type: string
      delay:
        description: "Seconds between video detail requests"
        required: false
        default: "1"
        type: string
      timeout:
        description: "HTTP timeout in seconds"
        required: false
        default: "30"
        type: string
      retries:
        description: "HTTP retries"
        required: false
        default: "2"
        type: string

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout database
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile javtiful_scraper.py crawler.py database.py providers/*.py

      - name: Crawl and synchronize database
        run: |
          python crawler.py \
            --scope "${{ inputs.source }} \
            --start-page "${{ inputs.start_page }} \
            --end-page "${{ inputs.end_page }} \
            --delay "${{ inputs.delay }} \
            --timeout "${{ inputs.timeout }} \
            --retries "${{ inputs.retries }}

      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/
          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi
          git commit -m "Update scraper database"
          git push
