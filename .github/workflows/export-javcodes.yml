name: Export Javtiful Video Codes

on:
  workflow_dispatch:
    inputs:
      javtiful_url:
        description: "Javtiful actress, channel, or category URL"
        required: true
        type: string
      delay:
        description: "Delay between listing-page requests (seconds)"
        required: false
        default: "0.5"
        type: string
      timeout:
        description: "HTTP timeout (seconds)"
        required: false
        default: "30"
        type: string
      retries:
        description: "HTTP retries per page"
        required: false
        default: "2"
        type: string

permissions:
  contents: write

concurrency:
  group: javcode-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python files
        run: python -m py_compile export_javcodes.py providers/*.py

      - name: Export video codes
        env:
          JAVTIFUL_URL: ${{ inputs.javtiful_url }}
          PAGE_DELAY: ${{ inputs.delay }}
          HTTP_TIMEOUT: ${{ inputs.timeout }}
          HTTP_RETRIES: ${{ inputs.retries }}
        run: |
          python export_javcodes.py \
            --url "$JAVTIFUL_URL" \
            --output-root Javcode \
            --chunk-size 100 \
            --delay "$PAGE_DELAY" \
            --timeout "$HTTP_TIMEOUT" \
            --retries "$HTTP_RETRIES"

      - name: Commit code files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Javcode/
          if git diff --cached --quiet; then
            echo "No Javcode changes to commit."
            exit 0
          fi
          git commit -m "Export video codes from Javtiful listing"
          git push

      - name: Upload exported JSON as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javtiful-video-codes
          path: Javcode/
          if-no-files-found: ignore
