name: Actress Index

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: "HTTP timeout in seconds"
        required: false
        default: "30"
        type: string
      retries:
        description: "HTTP retries"
        required: false
        default: "2"
        type: string

permissions:
  contents: write

concurrency:
  group: actress-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile actress_index.py actress_crawler.py javtiful_scraper.py crawler.py database.py providers/*.py
      - name: Refresh actress index
        env:
          TIMEOUT: ${{ inputs.timeout }}
          RETRIES: ${{ inputs.retries }}
        run: python actress_index.py --timeout "$TIMEOUT" --retries "$RETRIES"
      - name: Commit actress index
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/index/indexactress.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh actress crawl index"
          git push
