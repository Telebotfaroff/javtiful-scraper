name: Test scraper

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      javtiful_url:
        description: "Javtiful page, listing, actress, studio, or video URL to scrape"
        required: true
        type: string
      enrich:
        description: "Open individual video pages when testing a listing"
        required: false
        default: false
        type: boolean
      max_enrich:
        description: "Maximum videos to enrich (0 = no limit)"
        required: false
        default: 0
        type: number

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile javtiful_scraper.py
      - name: Import check
        run: python -c "from javtiful_scraper import JavtifulScraper; print('Import OK')"
      - name: CLI help check
        run: python javtiful_scraper.py --help
      - name: Live scraper test
        env:
          JAVTIFUL_TEST_URL: \${{ inputs.javtiful_url || vars.JAVTIFUL_TEST_URL }}
          ENRICH: \${{ inputs.enrich }}
          MAX_ENRICH: \${{ inputs.max_enrich }}
        run: |
          if [ -z "$JAVTIFUL_TEST_URL" ]; then
            echo "No Javtiful URL provided."
            exit 1
          fi

          ARGS=""
          if [ "$ENRICH" != "true" ]; then
            ARGS="$ARGS --no-enrich"
          fi
          if [ "\${MAX_ENRICH:-0}" != "0" ]; then
            ARGS="$ARGS --max-enrich $MAX_ENRICH"
          fi

          # shellcheck disable=SC2086
          python javtiful_scraper.py "$JAVTIFUL_TEST_URL" -o result.json $ARGS

          python - <<'PY'
          import json
          with open("result.json", encoding="utf-8") as f:
              data = json.load(f)

          if "type" not in data or "url" not in data:
              raise SystemExit("Result is missing required top-level fields")

          if data["type"] == "post":
              required = ["code", "title", "date", "duration", "thumbnail", "actresses", "studio", "genres", "description", "video_sources"]
              missing = [key for key in required if key not in data]
              if missing:
                  raise SystemExit(f"Missing post fields: {missing}")
          elif data["type"] == "listing":
              for key in ("page", "total_found", "items", "pagination"):
                  if key not in data:
                      raise SystemExit(f"Missing listing field: {key}")
              if not isinstance(data["items"], list):
                  raise SystemExit("listing.items must be a list")
          elif data["type"] == "actress_directory":
              for key in ("page", "total_found", "actresses", "pagination"):
                  if key not in data:
                      raise SystemExit(f"Missing actress directory field: {key}")
          elif data["type"] == "studio_directory":
              for key in ("page", "total_found", "studios", "pagination"):
                  if key not in data:
                      raise SystemExit(f"Missing studio directory field: {key}")
          else:
              raise SystemExit(f"Unknown scraper result type: {data['type']}")

          print(json.dumps(data, indent=2, ensure_ascii=False))
          print("\\nLive scraper test passed.")
          PY

      - name: Upload scraper result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-result
          path: result.json
          if-no-files-found: ignore
