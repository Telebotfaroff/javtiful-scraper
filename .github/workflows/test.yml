name: Test scraper

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile javtiful_scraper.py

      - name: Import check
        run: python -c "from javtiful_scraper import JavtifulScraper; print('Import OK')"

      - name: CLI help check
        run: python javtiful_scraper.py --help

      - name: Live scraper test
        env:
          JAVTIFUL_TEST_URL: ${{ vars.JAVTIFUL_TEST_URL }}
        run: |
          if [ -z "$JAVTIFUL_TEST_URL" ]; then
            echo "JAVTIFUL_TEST_URL is not configured."
            echo "Skipping live-site test. Set the repository variable to enable it."
            exit 0
          fi

          python javtiful_scraper.py "$JAVTIFUL_TEST_URL" -o result.json

          python - <<'PY'
          import json

          with open("result.json", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "url",
              "code",
              "title",
              "date",
              "duration",
              "thumbnail",
              "actresses",
              "studio",
              "genres",
              "description",
              "video_sources",
          ]

          missing = [key for key in required if key not in data]

          if missing:
              raise SystemExit(f"Missing fields: {missing}")

          print(json.dumps(data, indent=2, ensure_ascii=False))
          print("Live scraper test passed.")
          PY
