name: Start JAVDL Telegram Bot

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: javdl-telegram-bot
  cancel-in-progress: false

jobs:
  telegram-bot:
    name: Run Telegram bot
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a maximum runtime; restart the workflow when it ends.
    timeout-minutes: 350
    steps:
      - name: Check out javdl branch
        uses: actions/checkout@v4
        with:
          ref: javdl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate Telegram secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ("TELEGRAM_API_ID", "TELEGRAM_API_HASH", "TELEGRAM_BOT_TOKEN")
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              print("Missing GitHub Actions secrets: " + ", ".join(missing))
              print("Open repository Settings > Secrets and variables > Actions and add them.")
              sys.exit(1)

          try:
              int(os.environ["TELEGRAM_API_ID"])
          except ValueError:
              print("TELEGRAM_API_ID must be a numeric value.")
              sys.exit(1)

          print("Telegram secrets are configured.")
          PY

      - name: Start bot and accept messages
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_POST_CHANNEL_ID: ${{ secrets.TELEGRAM_POST_CHANNEL_ID }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          TELEGRAM_SESSION: javdl_actions
          TELEGRAM_UPLOAD_SESSION: javdl_actions_uploads
          TELEGRAM_UPLOAD_CLIENTS: "2"
          TELEGRAM_MAX_CONCURRENT_TRANSMISSIONS: "8"
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROCESSED_DB_BRANCH: javdl
          PROCESSED_DB_PATH: database/telegram_upload_history.json
          PYTHONUNBUFFERED: "1"
          AUTO_RESTART_AFTER_SECONDS: "14400"
          AUTO_RESTART_RETRY_SECONDS: "60"
          AUTO_RESTART_WORKFLOW: start-javdl-telegram-bot.yml
          AUTO_RESTART_REF: main
        run: |
          python -m compileall -q app main.py scripts
          python scripts/run_bot_with_restart.py
